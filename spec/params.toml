# ─────────────────────────────────────────────────────────────────────────────
#  JD-990 Parameter-Spezifikation — Single Source of Truth (ADR-3)
# ─────────────────────────────────────────────────────────────────────────────
#
#  Aus dieser Datei werden generiert: Rust-Structs, SysEx-Codec, Validierung,
#  UI-Metadaten und Testfälle. Ein Parameter existiert an genau EINER Stelle.
#  Adressbereiche und Blockgrößen stehen in addresses.toml.
#
#  FELDER JE PARAMETER
#    offset    Byte-Position im Block (Tone: 0–91, Patch Common: 0–117), linear.
#              Adresse = Blockbasis + (offset >> 7, offset & 0x7F).
#    bytes     2 = MSB/LSB-Paar (Wert = MSB·128 + LSB). Das LSB ist eine
#              „#“-Adresse (App. 50): ein DT1 darf dort NICHT beginnen — das
#              Paar wird immer gemeinsam ab dem MSB geschrieben.
#    raw       Zulässiger Rohwertbereich laut MIDI Implementation.
#    display   Anzeige: linear (raw.min…raw.max ↦ min…max), enum, note,
#              pan, table (→ [tables.*]), wavelist.
#
#  VERTRAUENSGRADE — bitte beim Bearbeiten pflegen:
#    verified = true   Gegen die offizielle MIDI Implementation geprüft
#                      (Owner's Manual v1.00, App. 52–54 = PDF-S. 260–262)
#                      UND alle 64 Werkspatches liegen im Bereich.
#    verified = false  Plausible Annahme. Für Layout brauchbar,
#                      zum Senden an das Gerät NICHT freigegeben.
#    Hardware-Bestätigung (HIL-Sweep, ADR-6) wird im Logbuch protokolliert.
#
#  Stand 2026-09-28: vollständig gegen das Handbuch abgeglichen, siehe
#  internes Logbuch. Viele Bereiche waren vorher falsch (0–127 statt 0–100,
#  Enum-Reihenfolgen, Key-Follow-Tabellen).
#
#  Feldreihenfolge und Namen ursprünglich abgeleitet aus JDTools, JD-990.hpp
#  © 2022–2024 Johannes Schultz, BSD 3-clause
#  https://github.com/sagamusix/JDTools
# ─────────────────────────────────────────────────────────────────────────────

[meta]
device      = "Roland JD-990"
model_id    = 0x57
spec_version = 2

# Basisadressen — Details und Blockgrößen in addresses.toml.
[meta.areas]
system            = { addr = [0x00, 0x00, 0x00, 0x00], verified = true }
temp_performance  = { addr = [0x01, 0x00, 0x00, 0x00], verified = true }
temp_patch        = { addr = [0x03, 0x00, 0x00, 0x00], verified = true }
# Rhythm ist out of scope. War bis spec_version 1 fälschlich 0x02 (= Performance-
# Temp-Patches); Handbuch App. 50 und JDTools: 0x04.
temp_special      = { addr = [0x04, 0x00, 0x00, 0x00], verified = true }

# Tone-Basisoffsets innerhalb des Patches (linear). 7-Bit-Adressen laut
# Handbuch App. 52: A = 00 00 76, B = 00 01 52, C = 00 02 2E, D = 00 03 0A.
# Hardware: 64/64 Patches byteidentisch über den Temp Patch (2026-09-28).
[meta.tone_bases]
size      = 92
verified  = true
a = 0x76
b = 0xD2
c = 0x12E
d = 0x18A

