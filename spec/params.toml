# ─────────────────────────────────────────────────────────────────────────────
#  NICHTLINEARE TABELLEN
#  values   = explizite Liste (Index = Rohwert)
#  segments = abschnittsweise linear: ab Rohwert `from` gilt start + (raw-from)·step
#  Die Summe aller Einträge muss raw.max + 1 des Parameters ergeben.
# ─────────────────────────────────────────────────────────────────────────────

# Pitch Key Follow [*4] — 17 Werte, KEINE gleichmäßige Skala
[tables.key_follow_pitch]
verified = true
unit = "%"
values = ["-100", "-50", "-20", "-10", "-5", "0", "+5", "+10", "+20", "+50",
          "+98", "+99", "+100", "+101", "+102", "+150", "+200"]

# TVF Cutoff Key Follow [*5] — -100…0 % in 10er-, dann +5…+150 % in 5er-Schritten
[tables.key_follow_tvf]
verified = true
unit = "%"
segments = [ { from = 0,  start = -100, step = 10 },     # 0–10  → -100 … 0
             { from = 11, start = 5,    step = 5  } ]    # 11–40 → +5 … +150

# Pan Key Follow [*6] — 15 Werte
[tables.key_follow_pan]
verified = true
unit = "%"
values = ["-100", "-70", "-50", "-40", "-30", "-20", "-10", "0",
          "+10", "+20", "+30", "+40", "+50", "+70", "+100"]

# Tone Delay Time [*3] — bei Mode NORMAL/HOLD/KEY-OFF in Sekunden,
# bei PLAYMATE 0–254 % (2 %-Schritte). Anzeige hängt vom Mode ab.
[tables.tone_delay_time]
verified = true
unit = "s"
segments = [ { from = 0,   start = 0.0, step = 0.01 },   # 0–100   → 0 … 1 s
             { from = 101, start = 1.1, step = 0.1  },   # 101–120 → 1.1 … 3 s
             { from = 121, start = 3.2, step = 0.2  },   # 121–125 → 3.2 … 4 s
             { from = 126, start = 4.5, step = 0.5  } ]  # 126–127 → 4.5, 5 s
alt = { when = "tone.wg.delay_mode == PLAYMATE", unit = "%", start = 0, step = 2 }

# Phaser Manual [*7]
[tables.phaser_manual]
verified = true
unit = "Hz"
segments = [ { from = 0,  start = 50,   step = 10  },    # 0–25  → 50 … 300
             { from = 26, start = 320,  step = 0   },    # 26    → 320
             { from = 27, start = 350,  step = 30  },    # 27–49 → 350 … 1010
             { from = 50, start = 1100, step = 200 },    # 50–85 → 1.1 k … 8.1 k
             { from = 86, start = 8500, step = 500 } ]   # 86–99 → 8.5 k … 15 k

# Chorus Delay Time [*9]
[tables.chorus_delay]
verified = true
unit = "ms"
segments = [ { from = 0,  start = 0.1, step = 0.1 },     # 0–49  → 0.1 … 5.0
             { from = 50, start = 5.5, step = 0.5 },     # 50–59 → 5.5 … 10
             { from = 60, start = 11,  step = 1   } ]    # 60–99 → 11 … 50

# Delay Tap Time [*10] — Rohwert = MSB·128 + LSB, 0–255
[tables.delay_tap]
verified = true
unit = "ms"
segments = [ { from = 0,   start = 0.1, step = 0.1 },    # 0–49    → 0.1 … 5.0
             { from = 50,  start = 5.5, step = 0.5 },    # 50–59   → 5.5 … 10
             { from = 60,  start = 11,  step = 1   },    # 60–89   → 11 … 40
             { from = 90,  start = 50,  step = 10  },    # 90–105  → 50 … 200
             { from = 106, start = 220, step = 20  } ]   # 106–245 → 220 … 3000
notes = { from = 246, values = ["16th", "8th triplet", "8th", "quarter triplet", "dotted 8th",
                                "quarter", "half triplet", "dotted quarter", "half", "whole"] }

# Reverb Time [*13] — ROOM/HALL in Sekunden; GATE/REVERSE/FLYING 5–500 ms
[tables.reverb_time]
verified = true
unit = "s"
segments = [ { from = 0,  start = 0.1, step = 0.1 },     # 0–79  → 0.1 … 8.0
             { from = 80, start = 8.5, step = 0.5 },     # 80–95 → 8.5 … 16
             { from = 96, start = 17,  step = 1   } ]    # 96–99 → 17 … 20
alt = { when = "reverb_type >= GATE", unit = "ms", start = 5, step = 5 }

# ─────────────────────────────────────────────────────────────────────────────
#  TONE — 92 Bytes, viermal pro Patch (A/B/C/D), Handbuch *4-3-2 (App. 54)
# ─────────────────────────────────────────────────────────────────────────────
