# ─────────────────────────────────────────────────────────────────────────────
#  PERFORMANCE — 144 Bytes: Common 48 (0–47) + Part 1–8 je 12 ab 48 (ADR-22)
#  Handbuch *4-2 (App. 51–52), am Handbuch-PDF abgelesen 2026-10-03.
#  Achtung: Die Beispiele auf App. 52 rechnen mit Part 1 ab 0x2E — falsch;
#  die Tabelle (0x30) passt zu allen 16 Performances im Backup (Dummy-Bytes 0).
#  Ein "#" im Handbuch (Voice Reserve 2–8, Tap-LSB) heißt: ein DT1 darf dort
#  nicht beginnen. Tap-Zeiten sind MSB/LSB-Paare; die Voice Reserve wird immer
#  als ganzer Block 0x11–0x18 geschrieben (Summe ≤ 24, siehe jd990-core).
#  Part 8 ist der Rhythm-Part (out of scope); Output/FX-Send gelten dort nicht.
#  verified = gegen das Handbuch; Hardware-Bestätigung folgt in P0 (Logbuch).
# ─────────────────────────────────────────────────────────────────────────────
[performance]
size = 144
common_size = 48
name_offset = 0
name_length = 16
reserved = [47]           # <dummy>
part_base = 48
part_size = 12
part_count = 8
part_reserved = [11]      # <dummy>

group_order = ["PERFORMANCE", "VOICE RESERVE", "PERF CHORUS", "PERF DELAY", "PERF REVERB", "PART"]

