# ─────────────────────────────────────────────────────────────────────────────
#  INIT-PATCH — Startpunkt für „von Grund auf" (M3) und Doppelklick-Wert
#
#  Regel für jeden Parameter ohne Eintrag hier:
#    linear mit negativem Anzeige-Minimum → Rohwert der Anzeige 0 (Mitte)
#    pan → Mitte · alles andere → raw.min
#  Die Einträge unten überschreiben die Regel (Rohwerte). Der Build prüft,
#  dass jeder Wert im Bereich liegt. Tone-Werte gelten für alle vier Tones;
#  aktiv ist nur Tone A. Effekte sind aus, damit der Init-Klang trocken ist.
#  Eigene Festlegung (2026-09-28), angelehnt an die Werkspatches — kein Roland-Wert.
