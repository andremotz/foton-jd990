schema: spec-driven

context: |
  Language: English
  All new artifacts must be written in English (ADR-26).
  Changes started in German (add-release-builds, add-plugin-mode) may stay German until archived.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: FotonJD990 — editor/librarian for the Roland JD-990 (Rust core + JUCE 9 host).
  Fundamental decisions are ADRs in docs/adr/, requirements are in
  docs/10-anforderungen.md. An OpenSpec change refers to them instead of repeating them.
  Non-negotiable (ADR-7/22): writes go only to the temp areas 03, 01, 02 00–06
  and System mode; never to the device's internal memory.

rules:
  proposal:
    - State what is explicitly not included
    - Name the branch the change is implemented on
  tasks:
    - Every task is a verifiable work item; hardware tests are separate tasks
    - The last task group is the acceptance before merging into main

operations:
  apply:
    guidance:
      - Implement only on the branch named in the proposal; merge into main only after acceptance
      - Tick off tasks in tasks.md in the same commit as the implementation
  archive:
    guidance:
      - Record significant decisions from design.md as an ADR
